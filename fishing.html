<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>손맛 줄다리기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root {
    --bg: #0d1b2a; --bg2: #12293f; --panel: #14263c; --line: #24405f;
    --txt: #e8f0f8; --sub: #9fb6cd; --accent: #4fc3f7; --accent-dk: #1d7fb0;
    --good: #45d17a; --warn: #f6c343; --bad: #ff5b5b;
    --disp: "Jua", "Malgun Gothic", sans-serif;
    --body: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(130% 90% at 50% -10%, #1a3a5c 0%, var(--bg) 62%);
    background-color: var(--bg);
    color: var(--txt); font-family: var(--body);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px 16px 40px; min-height: 100%; user-select: none; touch-action: manipulation;
  }
  .card {
    width: 100%; max-width: 460px;
    background: linear-gradient(180deg, var(--bg2), var(--panel));
    border: 1px solid var(--line); border-radius: 22px; padding: 24px 20px 26px;
    box-shadow: 0 22px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  }
  h1 { font-family: var(--disp); font-size: 28px; font-weight: 400; margin: 0 0 4px; text-align: center; letter-spacing: .02em; }
  .sub { color: var(--sub); font-size: 13px; text-align: center; margin-bottom: 16px; line-height: 1.6; }
  .fishbox { text-align: center; margin: 8px 0 14px; }
  .rig-wrap { margin: 2px 0 4px; }
  #rig { width: 100%; height: auto; display: block; }
  .fishemoji { font-size: 58px; line-height: 1; display: inline-block; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
  .fishemoji.wiggle { animation: wig .45s ease-in-out infinite; }
  @keyframes wig { 0%,100%{transform:rotate(-9deg) translateX(-3px)} 50%{transform:rotate(9deg) translateX(3px)} }
  .tier { font-family: var(--disp); font-size: 18px; margin-top: 4px; }
  .meta { font-size: 12px; color: var(--sub); margin-top: 4px; }

  .gauge { margin: 13px 0; }
  .gauge .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin-bottom: 5px; }
  .gauge .lbl span:last-child { color: var(--txt); font-variant-numeric: tabular-nums; }
  .bar { height: 22px; background: #0a1522; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid var(--line); }
  .fill { height: 100%; width: 0%; transition: width .05s linear; border-radius: 12px; }
  #progFill { background: linear-gradient(90deg, #2e9bd6, var(--good)); }
  #tenFill  { background: linear-gradient(90deg, var(--good), var(--warn) 55%, var(--bad)); }
  .redzone { position: absolute; top: 0; right: 0; height: 100%; width: 22%; background: rgba(255,91,91,.16); border-left: 1px dashed rgba(255,91,91,.55); }

  #hold {
    width: 100%; margin-top: 16px; padding: 22px; font-family: var(--disp); font-size: 22px;
    color: #06263a; background: linear-gradient(180deg, #7dd6ff, var(--accent));
    border: none; border-radius: 16px; cursor: pointer; box-shadow: 0 7px 0 var(--accent-dk);
    transition: transform .05s, box-shadow .05s; letter-spacing: .02em;
  }
  #hold:active, #hold.down { transform: translateY(6px); box-shadow: 0 1px 0 var(--accent-dk); }
  #hold[disabled] { opacity: .5; box-shadow: none; }
  .hint { text-align: center; color: var(--sub); font-size: 12px; margin-top: 10px; line-height: 1.6; }
  .timer { text-align: center; font-size: 12px; color: var(--sub); margin-top: 8px; }
  .timer b { color: var(--txt); font-variant-numeric: tabular-nums; }

  .btn {
    width: 100%; margin-top: 14px; padding: 16px; font-family: var(--disp); font-size: 18px;
    border: none; border-radius: 14px; cursor: pointer; color: #fff;
  }
  .btn.primary { background: var(--accent); color: #06263a; }
  .btn.retry { background: var(--warn); color: #3a2e00; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--sub); }

  .result { text-align: center; }
  .result .big { font-size: 50px; margin: 4px 0; }
  .result .headline { font-family: var(--disp); font-size: 24px; margin: 4px 0; }
  .result .desc { color: var(--sub); font-size: 14px; margin: 8px 0 4px; line-height: 1.6; }
  .good-c { color: var(--good); } .warn-c { color: var(--warn); } .bad-c { color: var(--bad); }
  .center { text-align: center; }
  .spinner { margin: 30px auto; width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .fishemoji.wiggle { animation: none; } #hold { transition: none; } }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <!-- 로딩 -->
    <div id="loading" class="center">
      <div class="spinner"></div>
      <div class="sub">입질 확인 중...</div>
    </div>

    <!-- 에러/만료 -->
    <div id="errbox" class="center hidden">
      <div class="big" style="font-size:44px">🎣</div>
      <h1>낚싯대를 던질 수 없어요</h1>
      <p class="desc sub" id="errmsg"></p>
    </div>

    <!-- 인트로 -->
    <div id="intro" class="hidden">
      <h1>🎣 손맛 대결!</h1>
      <div class="sub" id="introSub"></div>
      <div class="fishbox">
        <span class="fishemoji" id="introEmoji">🐟</span>
        <div class="tier" id="introTier"></div>
        <div class="meta" id="introMeta"></div>
      </div>
      <div class="hint">
        <b style="color:var(--txt)">부드럽게 꾹 눌러</b> 릴을 감고, 발악하면 손을 떼세요.<br>
        <span class="bad-c">마구 두드리면(잡아챌 때마다 장력↑) 줄이 끊깁니다.</span>
      </div>
      <button class="btn primary" id="startBtn">시작하기</button>
    </div>

    <!-- 게임 -->
    <div id="game" class="hidden">
      <div class="rig-wrap"><canvas id="rig" width="512" height="512"></canvas></div>
      <div class="meta" id="gameStatus" style="text-align:center;min-height:16px">릴을 감으세요!</div>
      <div class="gauge">
        <div class="lbl"><span>진행도</span><span id="progTxt">0%</span></div>
        <div class="bar"><div class="fill" id="progFill"></div></div>
      </div>
      <div class="gauge">
        <div class="lbl"><span>라인 장력</span><span id="tenTxt">0%</span></div>
        <div class="bar"><div class="redzone"></div><div class="fill" id="tenFill"></div></div>
      </div>
      <button id="hold">꾹 눌러 릴 감기</button>
      <div class="timer">남은 시간 <b id="timeTxt">30.0</b>초 · 시도 <b id="attemptTxt">1/2</b></div>
    </div>

    <!-- 결과 -->
    <div id="result" class="hidden result">
      <div class="big" id="resEmoji">🎉</div>
      <div class="headline" id="resHead"></div>
      <div class="desc" id="resDesc"></div>
      <button class="btn retry hidden" id="retryBtn">🔁 재도전</button>
      <div class="hint" id="resHint"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";
  var FN = "https://asia-northeast3-partyoverlay-786d6.cloudfunctions.net";

  var TIER_EMOJI = { "쓰레기":"🗑","일반":"🐟","고급":"🐠","희귀":"💎","영웅":"🔥","전설":"🌟","신화":"🐉","고대":"🦈" };
  var TIER_COLOR = { "쓰레기":"#9fb6cd","일반":"#8fd0ff","고급":"#5ad1c0","희귀":"#7ea6ff","영웅":"#ff9d5c","전설":"#ffd24a","신화":"#ff6fe0","고대":"#3fd6c4" };

  function $(id){ return document.getElementById(id); }
  function show(id){ $(id).classList.remove("hidden"); }
  function hide(id){ $(id).classList.add("hidden"); }
  function qs(k){ var m = location.search.match(new RegExp("[?&]"+k+"=([^&]+)")); return m ? decodeURIComponent(m[1]) : ""; }

  var token = qs("t");
  var sess = null;
  var resolved = false;
  var attempt = 1;          // 1=첫 판(공짜), 2=재도전(미끼값 차감)
  var MAX_ATTEMPT = 2;

  function fail(msg){ hide("loading"); show("errbox"); $("errmsg").textContent = msg; }

  if (!token) { fail("잘못된 접속이에요. 카톡의 /낚시 링크로 다시 들어와 주세요."); return; }

  // ── 세션 조회 ──
  fetch(FN + "/fishState?t=" + encodeURIComponent(token))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.ok) { fail((d && d.error) || "세션을 불러오지 못했어요."); return; }
      if (d.status === "done") { fail("이미 끝난 대결이에요. 카톡에서 결과를 확인하세요!"); return; }
      if (d.status === "playing") { fail("이미 시작된 대결이에요. 한 번 시작한 손맛은 다시 못 해요!"); return; }
      sess = d;
      initIntro();
    })
    .catch(function(){ fail("서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요."); });

  function initIntro(){
    var emo = TIER_EMOJI[sess.targetTier] || "🐟";
    var col = TIER_COLOR[sess.targetTier] || "#8fd0ff";
    hide("loading"); show("intro");
    $("introSub").textContent = sess.nick + " 님, 뭔가 걸렸다!";
    $("introEmoji").textContent = emo;
    $("introTier").textContent = "[" + sess.targetTier + "] " + (sess.targetFish || "?");
    $("introTier").style.color = col;
    $("introMeta").textContent = "🎣 " + (sess.rodName || "낚싯대") +
      "  ·  물고기 힘 " + Math.round((sess.strength||0.5)*100) + "%";
    loadRod();   // 낚싯대 이미지 프리로드(인트로 읽는 동안)
    // 시작할 때 세션 점유(pending→playing) → 재입장/타인 재플레이 차단
    $("startBtn").onclick = function(){
      var btn = $("startBtn");
      btn.disabled = true; btn.textContent = "시작 중...";
      fetch(FN + "/fishBegin", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({token:token}) })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d && d.ok) { hide("intro"); startGame(); }
          else { fail((d && d.error) || "이미 시작된 대결이에요."); }
        })
        .catch(function(){
          // 네트워크 실패 시엔 막지 않고 진행(정상 유저 우선). 점유는 안 되지만 드문 경우.
          hide("intro"); startGame();
        });
    };
  }

  // ── 낚싯대 리그(이미지 애니메이션) ──
  var ROD_FOLDER = { "나무 낚싯대":"01","대나무 낚싯대":"02","카본 낚싯대":"03","강철 낚싯대":"04","은 낚싯대":"05","티타늄 낚싯대":"06","미스릴 낚싯대":"07","황금 낚싯대":"08","다이아 낚싯대":"09","용왕의 낚싯대":"10",
    // 신규 3종 전용 그림
    "오리하르콘 낚싯대":"11","정령왕의 낚싯대":"12","흑룡의 낚싯대":"13" };
  var ROD_RIG = {
    "01":{tip:[425.42,90.87],mount:[260.96,317.92],guides:[[236.31,285.98],[305.97,203.83],[373.85,137.52],[425.42,90.87]]},
    "02":{tip:[429.68,84.24],mount:[199.94,364.43],guides:[[208.16,336.68],[263.14,236.39],[314.18,188.87],[365.15,139.07],[429.68,84.24]]},
    "03":{tip:[436.12,69.00],mount:[228.94,366.30],guides:[[247.65,327.46],[310.95,202.97],[347.05,165.09],[386.44,120.71],[436.12,69.00]]},
    "04":{tip:[432.55,79.43],mount:[222.87,367.84],guides:[[245.52,335.88],[343.52,174.15],[385.42,129.63],[415.32,99.69],[432.55,79.43]]},
    "05":{tip:[435.39,83.63],mount:[206.20,363.06],guides:[[220.13,347.16],[332.91,189.84],[386.01,133.21],[435.39,83.63]]},
    "06":{tip:[433.36,77.48],mount:[236.67,372.06],guides:[[263.17,332.81],[320.65,189.04],[372.50,136.95],[433.36,77.48]]},
    "07":{tip:[437.27,74.68],mount:[213.35,365.03],guides:[[198.51,351.94],[271.06,245.13],[343.17,168.55],[396.80,115.87],[437.27,74.68]]},
    "08":{tip:[438.21,65.53],mount:[220.44,343.10],guides:[[204.30,327.59],[298.86,215.43],[378.50,129.94],[405.17,103.78],[438.21,65.53]]},
    "09":{tip:[435.37,75.94],mount:[227.88,315.78],guides:[[219.51,308.39],[277.39,222.38],[327.24,170.73],[367.59,129.83],[399.79,102.99],[435.37,75.94]]},
    "10":{tip:[436.10,73.70],mount:[246.55,312.82],guides:[[229.41,302.63],[315.52,190.40],[354.76,149.77],[386.13,118.22],[412.07,93.40],[436.10,73.70]]},
    "11":{tip:[435.10,71.37],mount:[225.20,347.64],guides:[[246.89,248.11],[343.72,168.41],[388.60,124.90],[415.57,95.71],[435.10,71.37]]},
    "12":{tip:[437.12,67.93],mount:[227.61,330.88],guides:[[317.08,189.06],[370.18,135.12],[405.27,100.30],[420.11,84.75],[437.12,67.93]]},
    "13":{tip:[434.77,67.99],mount:[232.98,320.80],guides:[[322.33,176.52],[359.41,138.70],[387.82,113.11],[408.84,91.15],[426.11,77.76],[434.77,67.99]]}
  };
  var REEL_SCALE = 0.23, HOOK_SCALE = 0.12;
  // 한글 rodName 은 NFC/NFD 정규화가 갈려 매칭이 빗나갈 수 있음 → rodMult(숫자)로도 매핑.
  var ROD_BY_MULT = { "1":"01","1.2":"02","1.35":"03","1.5":"04","1.7":"05","1.9":"06","2.2":"07","2.6":"08","3":"09","4":"10",
    "3.25":"11","3.5":"12","3.75":"13" };
  var ROD_FOLDER_N = {}; // NFC 정규화 키
  (function(){ for (var k in ROD_FOLDER) { ROD_FOLDER_N[k.normalize ? k.normalize("NFC") : k] = ROD_FOLDER[k]; } })();
  function rodFolder(){
    var nm = (sess && sess.rodName) || "";
    if (nm && nm.normalize) nm = nm.normalize("NFC");
    if (ROD_FOLDER_N[nm]) return ROD_FOLDER_N[nm];              // 1) 이름(정규화) 매칭
    var mk = sess ? String(sess.rodMult) : "";
    if (ROD_BY_MULT[mk]) return ROD_BY_MULT[mk];                // 2) 배수(숫자) 매칭 — 인코딩 무관
    return "01";
  }
  var rig = null; // {folder, body, hook, sheet, ready}
  function loadImg(src){ return new Promise(function(res,rej){ var im=new Image(); im.onload=function(){res(im);}; im.onerror=rej; im.src=src; }); }
  function loadRod(){
    var f = rodFolder();
    rig = { folder:f, ready:false };
    Promise.all([loadImg("img/rods/"+f+"/body.png"), loadImg("img/rods/"+f+"/hook.png"), loadImg("img/rods/"+f+"/reel.png")])
      .then(function(a){ if(rig){ rig.body=a[0]; rig.hook=a[1]; rig.sheet=a[2]; rig.ready=true; } })
      .catch(function(){ rig = null; }); // 실패 시 이모지 폴백
  }
  function strokeLine(ctx, path, color, w){
    ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.beginPath(); path(); ctx.lineWidth=w+2; ctx.strokeStyle="rgba(10,21,34,.7)"; ctx.stroke();
    ctx.beginPath(); path(); ctx.lineWidth=w; ctx.strokeStyle=color; ctx.stroke();
  }
  function tensionColor(t){
    var f = (t-45)/55; if(f<0)f=0; if(f>1)f=1;
    return "rgb(" + Math.round(197+(255-197)*f) + "," + Math.round(217+(91-217)*f) + "," + Math.round(229+(91-229)*f) + ")";
  }

  // ── 줄다리기 게임 ──
  var LIMIT = 30;            // 제한시간(초)
  var GRAB_SHOCK = 7;        // 새로 '확 잡아챌' 때마다 장력 순간 상승 → 막클릭 방지
  var progress, tension, holding, timeLeft, peakTension;
  var struggle, struggleTimer, spool, over, gt;
  var raf = null, lastT = 0, rctx = null;

  function startGame(){
    show("game");
    progress = 0; tension = 0; holding = false;
    timeLeft = LIMIT; peakTension = 0;
    struggle = false; struggleTimer = 0.8 + Math.random()*1.1; // 첫 발악까지 여유
    spool = 0; over = null; gt = 0;
    $("attemptTxt").textContent = attempt + "/" + MAX_ATTEMPT;
    if (!rctx) rctx = $("rig").getContext("2d");
    bindHold();
    lastT = performance.now();
    raf = requestAnimationFrame(loop);
  }

  function bindHold(){
    var btn = $("hold");
    btn.disabled = false;
    function down(e){ e.preventDefault(); if (!over && !holding) { holding = true; tension += GRAB_SHOCK; } btn.classList.add("down"); }
    function up(e){ if(e) e.preventDefault(); holding = false; btn.classList.remove("down"); }
    btn.ontouchstart = down; btn.ontouchend = up; btn.ontouchcancel = up;
    btn.onmousedown = down; btn.onmouseup = up; btn.onmouseleave = up;
    // 안전: 창 밖으로 떼도 놓기
    window.onmouseup = up; window.ontouchend = up;
  }

  function loop(now){
    var dt = Math.min(0.05, (now - lastT)/1000);
    lastT = now; gt += dt;

    if (!over) {
      var strength = sess.strength || 0.5;     // 0~1 (물고기 힘)
      var rodPower = sess.rodPower || 1;        // 1~4 (낚싯대 성능)
      var diff     = sess.diff || 1;            // 난이도 배수(희귀할수록↑)
      var reelFactor = 0.9 + rodPower * 0.06;   // 좋은 대일수록 조금 잘 감김
      var tenFactor  = 1.18 - rodPower * 0.08;  // 좋은 대일수록 장력 덜 오름

      // 발악(struggle) 스케줄링
      struggleTimer -= dt;
      if (!struggle && struggleTimer <= 0) {
        struggle = true;
        struggleTimer = 0.4 + Math.random()*0.5 + strength*0.6; // 발악 지속(힘↑=길게)
      } else if (struggle && struggleTimer <= 0) {
        struggle = false;
        struggleTimer = (1.2 - strength*0.55) + Math.random()*1.0; // 다음 발악까지(힘↑=자주)
      }

      // 진행도: 홀드하면 항상 쌓임(놓으면 소폭 감소). 난이도는 장력에 실림.
      if (holding) progress += (20 * reelFactor) * dt;
      else         progress -= 5 * dt;

      // 장력: 물고기 힘 + 발악 + 난이도배수가 여기에 실림 (100%면 라인 끊김)
      if (holding) tension += (18 + strength*34) * (struggle ? 2.3 : 1) * tenFactor * diff * dt;
      else         tension -= 48 * dt;

      if (progress < 0) progress = 0;
      if (progress > 100) progress = 100;
      if (tension < 0) tension = 0;
      if (tension > peakTension) peakTension = tension;
      timeLeft -= dt;

      // 판정 → 아웃트로 연출 시작(즉시 결과창 X)
      if (tension >= 100)      over = { kind:"snap",    t:0 };
      else if (timeLeft <= 0)  over = { kind:"timeout", t:0 };
      else if (progress >= 100)over = { kind:"win",     t:0 };
      if (over) { holding = false; $("hold").disabled = true; }
    } else {
      over.t += dt;
    }

    render();
    drawRig(dt);

    if (over) {
      var dur = over.kind === "snap" ? 0.9 : 0.7;
      if (over.t >= dur) { finishGame(over.kind); return; }
    }
    raf = requestAnimationFrame(loop);
  }

  function render(){
    $("progFill").style.width = progress.toFixed(1) + "%";
    $("tenFill").style.width = tension.toFixed(1) + "%";
    $("progTxt").textContent = Math.round(progress) + "%";
    $("tenTxt").textContent = Math.round(tension) + "%";
    $("timeTxt").textContent = Math.max(0, timeLeft).toFixed(1);
    var st = $("gameStatus");
    if (over) {
      if (over.kind === "snap")      { st.textContent = "줄이 끊어졌다!"; st.className = "meta bad-c"; }
      else if (over.kind === "timeout"){ st.textContent = "놓쳤다..."; st.className = "meta bad-c"; }
      else                           { st.textContent = "낚았다!"; st.className = "meta good-c"; }
    } else if (struggle) { st.textContent = "발악 중! 손 떼!"; st.className = "meta bad-c"; }
    else { st.textContent = holding ? "감는 중..." : "릴을 감으세요!"; st.className = "meta"; }
  }

  // 수면은 리그 안에서만 그린다. 조작 UI 및 게임 판정에는 영향을 주지 않는다.
  var WATER_Y = 432;
  var waterMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
  var waterFish = [
    {x:70, y:459, speed:15, size:0.65, phase:0.2},
    {x:314, y:488, speed:-11, size:0.85, phase:2.1},
    {x:462, y:468, speed:-8, size:0.5, phase:4.3}
  ];
  function surfaceY(x, t){
    return WATER_Y + Math.sin(x*0.025+t*0.7)*1.8 + Math.sin(x*0.059-t*0.4)*0.7;
  }
  function waterPath(ctx, t){
    ctx.beginPath(); ctx.moveTo(0, surfaceY(0,t));
    for(var x=8;x<=512;x+=8) ctx.lineTo(x,surfaceY(x,t));
    ctx.lineTo(512,512); ctx.lineTo(0,512); ctx.closePath();
  }
  function drawWater(ctx, t){
    ctx.save(); waterPath(ctx,t); ctx.clip();
    var water = ctx.createLinearGradient(0,WATER_Y,0,512);
    water.addColorStop(0,"rgba(38,113,122,.66)");
    water.addColorStop(0.32,"rgba(23,79,94,.84)");
    water.addColorStop(1,"rgba(16,49,67,.30)");
    ctx.fillStyle=water; ctx.fillRect(0,WATER_Y-4,512,88);
    // 희미한 실루엣만 지나가며, 별도의 물속 단면이나 바닥은 그리지 않는다.
    waterFish.forEach(function(f){
      var x=((f.x+t*f.speed+70)%652+652)%652-70;
      var y=f.y+Math.sin(t*0.45+f.phase)*3;
      var tail=Math.sin(t*3.4+f.phase)*4;
      ctx.save(); ctx.translate(x,y); if(f.speed<0)ctx.scale(-1,1);
      ctx.scale(f.size,f.size); ctx.fillStyle="rgba(3,24,37,.42)";
      ctx.shadowColor="rgba(3,24,37,.2)";ctx.shadowBlur=3;
      ctx.beginPath();ctx.moveTo(29,0);ctx.bezierCurveTo(12,-10,-6,-10,-21,tail*.3);
      ctx.lineTo(-35,-10+tail);ctx.quadraticCurveTo(-29,tail,-35,10+tail);
      ctx.lineTo(-21,tail*.3);ctx.bezierCurveTo(-6,10,12,10,29,0);ctx.fill();
      ctx.beginPath();ctx.moveTo(3,-6);ctx.lineTo(-12,-15);ctx.lineTo(-9,-4);ctx.fill();ctx.restore();
    });
    // 반사가 그림자 위로 지나가도록 가장 나중에 겹친다.
    for(var i=0;i<23;i++){
      var rx=(i*113.7)%512+Math.sin(t*0.35+i)*7;
      var ry=WATER_Y+6+(i*17.3)%73;
      ctx.beginPath();ctx.moveTo(rx,ry);ctx.quadraticCurveTo(rx+10,ry+Math.sin(t*0.7+i)*1.4,rx+22,ry);
      ctx.strokeStyle="rgba(138,210,209,"+(0.06+0.035*Math.sin(t*0.6+i))+")";
      ctx.lineWidth=0.8;ctx.stroke();
    }
    ctx.restore();
    ctx.save();ctx.beginPath();ctx.moveTo(0,surfaceY(0,t));
    for(var sx=8;sx<=512;sx+=8)ctx.lineTo(sx,surfaceY(sx,t));
    ctx.strokeStyle="rgba(142,221,218,.40)";ctx.lineWidth=1.4;ctx.stroke();ctx.restore();
  }
  function drawWaterContact(ctx, x, t, active){
    ctx.save(); waterPath(ctx,t);ctx.clip();
    for(var i=0;i<3;i++){
      var p=(t*(active?1.25:0.55)+i/3)%1;
      ctx.beginPath();ctx.ellipse(x,surfaceY(x,t)+3,4+p*(active?24:18),2+p*5,0,0,Math.PI*2);
      ctx.strokeStyle="rgba(180,234,226,"+((1-p)*(active?0.48:0.30))+")";
      ctx.lineWidth=1;ctx.stroke();
    }
    ctx.restore();
  }

  // 캔버스 리그 렌더 (512×512 좌표계). 릴 회전=감을 때, 물고기=진행도만큼 위로.
  function drawRig(dt){
    var ctx = rctx; if (!ctx) return;
    ctx.clearRect(0, 0, 512, 512);
    var wt = waterMotion && waterMotion.matches ? 0 : gt;
    drawWater(ctx,wt);
    if (holding && !over) spool += dt * 22; // 감는 중에만 릴 회전

    var ready = rig && rig.ready;
    var tip = ready ? ROD_RIG[rig.folder].tip : [430, 80];
    var lowY = 486, topY = tip[1] + 52;
    var fishY = lowY + (topY - lowY) * (progress / 100);
    var sway = (struggle ? 6 : 2) * Math.sin(gt * (struggle ? 18 : 5));
    var hx = tip[0] + sway;
    var broken = false, gone = false, popped = false;
    if (over) {
      if (over.kind === "snap")        { broken = true; fishY = Math.min(560, fishY + over.t*over.t*420); hx = tip[0] - over.t*22; }
      else if (over.kind === "timeout"){ gone = over.t > 0.5; fishY = Math.min(560, fishY + over.t*280); }
      else                             { popped = true; fishY = topY - over.t*30; }
    }

    var tcol = tensionColor(tension);
    if (ready) {
      var r = ROD_RIG[rig.folder];
      ctx.drawImage(rig.body, 0, 0, 512, 512);
      strokeLine(ctx, function(){ for (var i=0;i<r.guides.length;i++){ var p=r.guides[i]; i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); } }, "#c5d9e5", 3);
      if (!broken) strokeLine(ctx, function(){ ctx.moveTo(tip[0],tip[1]); ctx.lineTo(hx,fishY); }, tcol, 3);
      else strokeLine(ctx, function(){ ctx.moveTo(tip[0],tip[1]); ctx.bezierCurveTo(tip[0]+4, tip[1]+55, tip[0]-28*over.t, tip[1]+115, tip[0]-24*over.t, tip[1]+145); }, "#c5d9e5", 3);
      var frame = ((Math.round(spool) % 32) + 32) % 32;
      var sz = 512 * REEL_SCALE;
      ctx.drawImage(rig.sheet, (frame%8)*512, Math.floor(frame/8)*512, 512, 512, r.mount[0]-sz/2, r.mount[1]-sz/2, sz, sz);
      var hsz = 512 * HOOK_SCALE;
      ctx.drawImage(rig.hook, hx-256*HOOK_SCALE, fishY-64*HOOK_SCALE, hsz, hsz);
    } else {
      // 폴백(이미지 로딩 전): 간단한 줄만
      strokeLine(ctx, function(){ ctx.moveTo(tip[0],tip[1]); ctx.lineTo(hx,fishY); }, broken?"#c5d9e5":tcol, 3);
    }

    // 줄과 수면의 실제 교점. 바늘이 수면 위로 올라오거나 줄이 끊기면 파문도 없어진다.
    var waterAt = surfaceY(hx,wt);
    if(!broken && !gone && fishY >= waterAt && fishY > tip[1]){
      var contactX=tip[0]+(hx-tip[0])*(waterAt-tip[1])/(fishY-tip[1]);
      drawWaterContact(ctx,contactX,wt,struggle && !(waterMotion && waterMotion.matches));
    }

    // 물고기 이모지 (바늘 위치)
    if (!gone) {
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      var fe = TIER_EMOJI[sess.targetTier] || "🐟";
      var scale = popped ? (1 + Math.min(0.5, over.t*0.9)) : 1;
      var jit = struggle ? (Math.random()*4-2) : 0;
      ctx.save();
      ctx.translate(hx + jit, fishY + 20 + jit);
      ctx.scale(scale, scale);
      ctx.font = "46px serif";
      ctx.fillText(fe, 0, 0);
      ctx.restore();
    }
  }

  function finishGame(kind){
    if (raf) cancelAnimationFrame(raf); raf = null;
    holding = false;
    $("hold").disabled = true;
    hide("game"); show("result");
    $("retryBtn").classList.add("hidden");
    $("resHint").textContent = "";

    if (kind === "win") {
      var elapsed = (LIMIT - timeLeft);
      if (sess.targetTier === "고대") {
        // 고대(메갈로돈): 대성공 없음, 등급 상승 없음 — 포획 그 자체가 잭팟
        $("resEmoji").textContent = "🦈";
        $("resHead").innerHTML = '<span class="good-c">메갈로돈 포획!!</span>';
        $("resHead").className = "headline";
        $("resDesc").textContent = "고대의 포식자를 제압했다! (" + elapsed.toFixed(1) + "초)";
        doResolve("success");
      } else {
        // 대성공: 성공 시 10% 확률(운). 등급 2단계↑
        var great = (Math.random() < 0.10);
        var outcome = great ? "great" : "success";
        $("resEmoji").textContent = great ? "🌟" : "🎉";
        $("resHead").innerHTML = great
          ? '<span class="good-c">대성공!!</span> 두 단계 위 물고기!'
          : '<span class="good-c">성공!</span> 한 단계 위 물고기!';
        $("resHead").className = "headline";
        $("resDesc").textContent = great
          ? "운까지 따랐다! 대박 손맛! (" + elapsed.toFixed(1) + "초)"
          : "멋지게 낚아 올렸어요! (" + elapsed.toFixed(1) + "초)";
        doResolve(outcome);
      }
    } else {
      // 실패 (snap=라인끊김 / timeout=놓침)
      $("resEmoji").textContent = kind === "snap" ? "💥" : "🐟💨";
      $("resHead").innerHTML = kind === "snap"
        ? '<span class="bad-c">라인이 끊어졌다!</span>'
        : '<span class="bad-c">놓쳤다...</span>';
      $("resHead").className = "headline";
      if (attempt < MAX_ATTEMPT) {
        var cost = sess.baitCost || 0;
        $("resDesc").innerHTML = "첫 판은 공짜! <b>미끼값 " + cost + "코인</b> 내고 한 번 더 해볼까요?";
        var rb = $("retryBtn");
        rb.textContent = "🔁 재도전 (미끼값 " + cost + "코인)";
        rb.classList.remove("hidden");
        rb.onclick = function(){
          attempt = MAX_ATTEMPT;
          hide("result");
          startGame();
        };
      } else {
        $("resDesc").textContent = "재도전까지 했지만 놓쳤어요. 미끼값이 차감돼요 ㅠ";
        doResolve("fail");
      }
    }
  }

  function doResolve(outcome){
    if (resolved) return; resolved = true;
    $("hold").disabled = true;
    var body = JSON.stringify({ token: token, outcome: outcome, retryUsed: (attempt >= MAX_ATTEMPT) });
    fetch(FN + "/fishResolve", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: body
    })
    .then(function(r){ return r.json(); })
    .then(function(){ $("resHint").textContent = "✅ 결과가 카톡으로 전송됐어요. 채팅방을 확인하세요!"; })
    .catch(function(){ $("resHint").textContent = "⚠️ 결과 전송에 실패했어요. 네트워크 확인 후 새로고침해 보세요."; });
  }
})();
</script>
</body>
</html>
