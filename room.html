<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>낚시터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root {
    --bg:#0d1b2a; --bg2:#12293f; --panel:#14263c; --line:#24405f;
    --txt:#e8f0f8; --sub:#9fb6cd; --accent:#4fc3f7; --accent-dk:#1d7fb0;
    --good:#45d17a; --warn:#f6c343; --bad:#ff5b5b; --gold:#ffd964;
    --disp:"Jua","Malgun Gothic",sans-serif;
    --body:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; }
  body {
    background:radial-gradient(130% 80% at 50% -10%, #1a3a5c 0%, var(--bg) 60%);
    background-color:var(--bg); color:var(--txt); font-family:var(--body);
    display:flex; justify-content:center; padding:18px 14px 48px; user-select:none;
  }
  .card { width:100%; max-width:480px; }
  .err { text-align:center; color:var(--sub); font-size:14px; line-height:1.8; padding:40px 10px; }
  h1 { font-family:var(--disp); font-size:26px; font-weight:400; margin:0; letter-spacing:.02em; }
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .coins { font-family:var(--disp); font-size:18px; color:var(--gold); background:#0a1522;
           border:1px solid var(--line); border-radius:12px; padding:7px 13px; }
  .coins b { font-variant-numeric:tabular-nums; }

  .gear { background:linear-gradient(180deg,var(--bg2),var(--panel)); border:1px solid var(--line);
          border-radius:16px; padding:12px 14px; margin-bottom:12px; font-size:13px; }
  .gear .row { display:flex; justify-content:space-between; padding:3px 0; }
  .gear .row span:first-child { color:var(--sub); }
  .dex { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .dex .d { font-size:11px; color:var(--sub); background:#0a1522; border:1px solid var(--line);
            border-radius:8px; padding:3px 7px; }
  .dex .d b { color:var(--txt); }

  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .tab { flex:0 0 auto; font-family:var(--disp); font-size:13px; padding:8px 11px; border-radius:11px;
         background:#0a1522; border:1px solid var(--line); color:var(--sub); cursor:pointer; white-space:nowrap; }
  .tab.on { background:var(--accent); color:#06263a; border-color:var(--accent); }
  .tab.lock { opacity:.5; }

  .item { display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,var(--bg2),var(--panel));
          border:1px solid var(--line); border-radius:13px; padding:11px 13px; margin-bottom:8px; }
  .item.cur { border-color:var(--good); box-shadow:inset 0 0 0 1px rgba(69,209,122,.3); }
  .item .nm { font-family:var(--disp); font-size:16px; }
  .item .st { font-size:11px; color:var(--sub); margin-top:2px; }
  .item .mid { flex:1; min-width:0; }
  .item .pr { text-align:right; font-size:12px; color:var(--gold); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .buy { font-family:var(--disp); font-size:14px; border:none; border-radius:10px; padding:9px 12px;
         cursor:pointer; color:#06263a; background:linear-gradient(180deg,#7dd6ff,var(--accent)); white-space:nowrap; }
  .buy:active { transform:translateY(1px); }
  .buy[disabled] { background:#1a2c42; color:var(--sub); cursor:default; }
  .buy.cur { background:transparent; color:var(--good); border:1px solid var(--good); }

  .dexg { background:linear-gradient(180deg,var(--bg2),var(--panel)); border:1px solid var(--line); border-radius:12px; padding:9px 11px; margin-bottom:8px; }
  .dgh { font-family:var(--disp); font-size:14px; margin-bottom:6px; }
  .dgh span { color:var(--sub); font-size:12px; }
  .dgb { display:flex; flex-wrap:wrap; gap:5px; }
  .fc { font-size:12px; background:#0a1522; border:1px solid var(--line); border-radius:7px; padding:3px 7px; color:var(--txt); }
  .fc.miss { color:var(--sub); opacity:.65; }
  .gatebox { max-width:360px; margin:18px auto 0; text-align:center; }
  .gatebox .gt { font-family:var(--disp); font-size:22px; margin-bottom:6px; }
  .gin { width:100%; margin-top:10px; padding:14px 16px; font-size:17px; text-align:center;
         background:#0a1522; border:1px solid var(--line); border-radius:12px; color:var(--txt);
         font-family:var(--body); outline:none; }
  .gin:focus { border-color:var(--accent); }
  .btn { width:100%; margin-top:14px; padding:16px; font-family:var(--disp); font-size:18px; border:none;
         border-radius:14px; cursor:pointer; color:#06263a; background:linear-gradient(180deg,#7dd6ff,var(--accent)); }
  .btn[disabled] { opacity:.5; }
  .soon { text-align:center; color:var(--sub); font-size:14px; line-height:1.9; padding:34px 10px; }
  .soon .big { font-size:40px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
           background:#0a1522; border:1px solid var(--line); color:var(--txt); font-size:14px;
           padding:11px 18px; border-radius:12px; opacity:0; transition:.25s; pointer-events:none; max-width:90%; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="card">
  <div id="loading" class="err">낚시터 불러오는 중…</div>
  <div id="errbox" class="err hidden"><div style="font-size:34px">🎣</div><div id="errmsg"></div></div>

  <div id="gate" class="hidden">
    <div class="head"><h1>🎣 낚시터</h1></div>
    <div class="gatebox">
      <div class="gt" id="gateTitle">🔒 비밀번호</div>
      <div class="sub" id="gateDesc" style="margin-bottom:4px"></div>
      <input id="gpass" class="gin" type="password" placeholder="비밀번호" autocomplete="off">
      <input id="gpass2" class="gin hidden" type="password" placeholder="비밀번호 확인" autocomplete="off">
      <button class="btn" id="gbtn">확인</button>
      <div class="hint" id="gmsg"></div>
    </div>
  </div>

  <div id="main" class="hidden">
    <div class="head">
      <h1>🎣 낚시터</h1>
      <div class="coins">🪙 <b id="coinTxt">0</b></div>
    </div>

    <div class="gear">
      <div class="row"><span>🎣 낚싯대</span><b id="gRod">-</b></div>
      <div class="row"><span>🧵 낚싯줄</span><b id="gLine">-</b></div>
      <div class="row"><span>🎣 찌</span><b id="gFloat">-</b></div>
      <div class="row"><span>🪱 미끼</span><b id="gBait">-</b></div>
      <div class="row"><span>🏆 최대어</span><b id="gBest">-</b></div>
      <div class="dex" id="dexBox"></div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var FN = "https://asia-northeast3-partyoverlay-786d6.cloudfunctions.net";
  function $(id){ return document.getElementById(id); }
  function show(id){ $(id).classList.remove("hidden"); }
  function hide(id){ $(id).classList.add("hidden"); }
  function qs(k){ var m=location.search.match(new RegExp("[?&]"+k+"=([^&]+)")); return m?decodeURIComponent(m[1]):""; }
  function fail(msg){ hide("loading"); hide("main"); show("errbox"); $("errmsg").textContent=msg; }
  function won(n){ return (n||0).toLocaleString("ko-KR"); }
  var toastT;
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); },1800); }

  var token = qs("t");
  var st = null, tab = "rod", busy = false, resetTimer = null, lastGacha = null;
  var DEXN = ["📖도감1","📗도감2","📘도감3","📙도감4"];
  var TABS = [
    {id:"rod",   name:"🎣 낚싯대", lock:false},
    {id:"line",  name:"🧵 낚싯줄", lock:false},
    {id:"float", name:"🎣 찌",    lock:false},
    {id:"dex",   name:"📖 도감",   lock:false},
    {id:"odds",  name:"🎲 확률",   lock:false},
    {id:"bait",  name:"🪱 미끼",   lock:false},
    {id:"enh",   name:"⚒ 강화",   lock:false},
    {id:"reset", name:"⏱ 즉시권",  lock:false},
    {id:"gacha", name:"🎰 가챠",   lock:false}
  ];

  var pass = null, gateMode = null;
  if (!token){ fail("잘못된 접속이에요.\n카톡에서 /낚시 방 으로 다시 열어주세요."); return; }

  function openRoom(){ hide("loading"); hide("gate"); show("main"); buildTabs(); render(); }

  function showGate(mode){
    gateMode=mode; hide("loading"); hide("main"); show("gate");
    if (mode==="set"){
      $("gateTitle").textContent="🔒 비밀번호 설정";
      $("gateDesc").textContent="처음이네요! 이 낚시터에 쓸 비밀번호(4~20자)를 정하세요.";
      $("gpass2").classList.remove("hidden"); $("gbtn").textContent="설정하기";
    } else {
      $("gateTitle").textContent="🔒 비밀번호 입력";
      $("gateDesc").textContent="본인만 열 수 있어요.";
      $("gpass2").classList.add("hidden"); $("gbtn").textContent="입력";
    }
    $("gpass").value=""; $("gpass2").value=""; $("gmsg").textContent=""; $("gpass").focus();
  }

  $("gbtn").onclick=function(){
    var p1=$("gpass").value;
    if (gateMode==="set"){
      var p2=$("gpass2").value;
      if (p1.length<4||p1.length>20){ $("gmsg").textContent="4~20자로 입력하세요."; return; }
      if (p1!==p2){ $("gmsg").textContent="확인이 일치하지 않아요."; return; }
      $("gbtn").disabled=true;
      fetch(FN+"/fishRoomSetPass",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:token,pass:p1})})
        .then(function(r){return r.json();}).then(function(d){ $("gbtn").disabled=false;
          if(d&&d.ok){ pass=p1; loadState(false); } else { $("gmsg").textContent=(d&&d.error)||"설정 실패"; }
        }).catch(function(){ $("gbtn").disabled=false; $("gmsg").textContent="네트워크 오류"; });
    } else {
      if(!p1){ $("gmsg").textContent="비밀번호를 입력하세요."; return; }
      pass=p1; loadState(true);
    }
  };
  $("gpass").addEventListener("keydown",function(e){ if(e.key==="Enter"&&gateMode!=="set") $("gbtn").click(); });
  $("gpass2").addEventListener("keydown",function(e){ if(e.key==="Enter") $("gbtn").click(); });

  function loadState(fromEnter){
    var url=FN+"/fishRoomState?t="+encodeURIComponent(token)+(pass?("&pass="+encodeURIComponent(pass)):"");
    fetch(url).then(function(r){return r.json();}).then(function(d){
      if (d&&d.ok){ st=d.state; openRoom(); }
      else if (d&&d.needPass){
        showGate(d.needPass);
        if (fromEnter && d.needPass==="enter") $("gmsg").textContent="비밀번호가 틀렸어요.";
      }
      else fail((d&&d.error)||"불러오지 못했어요.");
    }).catch(function(){ fail("서버에 연결하지 못했어요.\n잠시 후 다시 시도해 주세요."); });
  }

  loadState(false);

  function buildTabs(){
    var box=$("tabs"); box.innerHTML="";
    TABS.forEach(function(t){
      var b=document.createElement("div");
      b.className="tab"+(t.id===tab?" on":"")+(t.lock?" lock":"");
      b.textContent=t.name;
      b.onclick=function(){ tab=t.id; buildTabs(); render(); };
      box.appendChild(b);
    });
  }

  function render(){
    if (resetTimer){ clearInterval(resetTimer); resetTimer=null; } // 탭 전환 시 카운트다운 정리
    // 상단 요약
    $("coinTxt").textContent = won(st.coins);
    var pl = function(n){ return n>0 ? (" +"+n) : ""; };
    $("gRod").textContent = st.rod + pl(st.rodLvl||0);
    $("gLine").textContent = st.line + pl(st.lineLvl||0);
    $("gFloat").textContent = st.float + pl(st.floatLvl||0);
    $("gBait").textContent = st.bait ? st.bait : "무미끼";
    $("gBest").textContent = st.best ? (st.best.name+" "+st.best.size+"cm") : "-";
    var db=$("dexBox"); db.innerHTML="";
    for (var i=0;i<4;i++){ var d=document.createElement("div"); d.className="d";
      d.innerHTML=DEXN[i]+" <b>"+st.dex[i]+"</b>/"+st.dexTotals[i]; db.appendChild(d); }

    var p=$("panel"); p.innerHTML="";
    if (tab==="rod")   return renderShop(p, st.rods, "rod", rodStat);
    if (tab==="line")  return renderShop(p, st.lines, "line", lineStat);
    if (tab==="float") return renderShop(p, st.floats, "float", floatStat);
    if (tab==="dex")   return renderDex(p);
    if (tab==="odds")  return renderOdds(p);
    if (tab==="bait")  return renderBait(p);
    if (tab==="enh")   return renderEnhance(p);
    if (tab==="reset") return renderReset(p);
    if (tab==="gacha") return renderGacha(p);
  }

  function renderOdds(p){
    var o = st.odds || {tiers:[], coinMult:1};
    var h = '<div style="text-align:center;font-family:var(--disp);font-size:16px;margin:2px 0 12px">🎲 등급 확률 [<span style="color:var(--accent)">'+st.rod+'</span>]</div>';
    o.tiers.forEach(function(t){
      h += '<div class="item" style="padding:9px 13px"><div class="mid"><div class="nm" style="font-size:15px">'+t.emoji+' '+t.tier+'</div></div>'+
           '<div class="pr" style="color:var(--txt);font-size:15px">'+t.pct.toFixed(t.pct<1?2:1)+'%</div></div>';
    });
    h += '<div class="gear" style="margin-top:10px;text-align:center;font-family:var(--disp);font-size:15px;color:var(--gold)">💰 코인 배수 ×'+o.coinMult+'</div>';
    h += '<div class="soon" style="padding:12px 10px;font-size:12px">낚싯대·미끼·이벤트에 따라 자동 반영돼요'+(st.bait?('<br>🪱 '+st.bait+' 효과 포함'):'')+'</div>';
    p.innerHTML = h;
  }

  function renderBait(p){
    var h = '<div class="soon" style="padding:6px 10px 12px;font-size:12px;line-height:1.7">🪱 미끼는 <b style="color:var(--txt)">캐스팅마다 1개 소모</b>되고 희귀+ 확률을 올려줘요.<br>재고가 떨어지면 자동으로 해제돼요.</div>';
    var cur = st.bait || "";
    h += '<div class="gear" style="text-align:center;margin-bottom:12px"><span style="color:var(--sub)">장착 미끼</span> &nbsp; '+
         '<b style="font-family:var(--disp);font-size:16px;color:'+(cur?"var(--good)":"var(--sub)")+'">'+(cur?cur:"무미끼")+'</b>'+
         (cur?' <button class="buy" style="padding:5px 10px;font-size:12px;margin-left:8px" data-eq="">해제</button>':'')+'</div>';
    (st.baits||[]).forEach(function(it){
      var owned = it.count>0, equipped = it.cur;
      h += '<div class="item'+(equipped?" cur":"")+'" style="flex-wrap:wrap">';
      h += '<div class="mid" style="flex:1 1 55%"><div class="nm">'+it.name+(owned?' <span style="font-size:12px;color:var(--good)">×'+won(it.count)+'</span>':'')+
           '</div><div class="st">희귀↑ ×'+it.luck+'  ·  개당 🪙'+won(it.price)+'</div></div>';
      if (equipped) h += '<button class="buy cur" disabled style="flex:0 0 auto">✅ 장착중</button>';
      else if (owned) h += '<button class="buy" style="flex:0 0 auto" data-eq="'+encodeURIComponent(it.name)+'">장착</button>';
      else h += '<span class="pr" style="flex:0 0 auto">미보유</span>';
      h += '<div style="flex:1 1 100%;display:flex;gap:6px;margin-top:8px">';
      (st.baitPacks||[10,50,100]).forEach(function(q){
        var cost=it.price*q, can=st.coins>=cost;
        h += '<button class="buy" style="flex:1;padding:7px 4px;font-size:13px;line-height:1.25'+(can?"":";opacity:.45")+'" '+
             (can?('data-buy="'+encodeURIComponent(it.name)+'" data-qty="'+q+'"'):"disabled")+'>×'+q+'<br><span style="font-size:10px">🪙'+won(cost)+'</span></button>';
      });
      h += '</div></div>';
    });
    p.innerHTML = h;
    Array.prototype.forEach.call(p.querySelectorAll("[data-eq]"), function(b){
      b.onclick=function(){ baitAction("equip", decodeURIComponent(b.getAttribute("data-eq")), 0, b); };
    });
    Array.prototype.forEach.call(p.querySelectorAll("[data-buy]"), function(b){
      b.onclick=function(){ baitAction("buy", decodeURIComponent(b.getAttribute("data-buy")), +b.getAttribute("data-qty"), b); };
    });
  }
  function fmtDur(ms){ var s=Math.max(0,Math.ceil(ms/1000)); var m=Math.floor(s/60); s=s%60; return m+"분 "+(s<10?"0":"")+s+"초"; }
  function renderReset(p){
    var r = st.reset || {onCooldown:false, remainMs:0, cooldownMin:20, usedToday:0, price:0};
    var h = '<div class="soon" style="padding:6px 10px 12px;font-size:12px;line-height:1.7">⏱ 쿨타임(약 '+r.cooldownMin+'분)을 <b style="color:var(--txt)">즉시 없애고</b> 바로 낚시할 수 있어요.<br>가격은 <b style="color:var(--txt)">낚싯대가 좋을수록 · 오늘 많이 쓸수록</b> 올라가요.</div>';
    if (r.onCooldown){
      var can = st.coins >= r.price;
      h += '<div class="item" style="flex-direction:column;align-items:stretch;gap:10px;text-align:center;padding:18px 14px">';
      h += '<div style="font-size:13px;color:var(--sub)">남은 쿨타임</div>';
      h += '<div id="rsRemain" style="font-family:var(--disp);font-size:30px;color:var(--accent)">'+fmtDur(r.remainMs)+'</div>';
      h += '<div style="font-size:13px;color:var(--gold)">즉시 리셋 🪙 '+won(r.price)+(r.usedToday>0?' <span style="color:var(--sub);font-size:11px">(오늘 '+r.usedToday+'번 씀)</span>':'')+'</div>';
      h += '<button class="btn" id="rsBtn" style="margin-top:4px"'+(can?'':' disabled')+'>⏱ 즉시 리셋'+(can?'':' (코인 부족)')+'</button>';
      h += '</div>';
    } else {
      h += '<div class="item" style="flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px 14px;border-color:var(--good)">';
      h += '<div style="font-size:30px">✅</div><div style="font-family:var(--disp);font-size:18px">지금 바로 낚시 가능!</div>';
      h += '<div style="font-size:12px;color:var(--sub)">카톡에서 /낚시 하세요.<br>쿨타임이 생기면 여기서 즉시 리셋할 수 있어요.</div>';
      h += '</div>';
    }
    h += '<div class="dexg" style="margin-top:10px"><div class="dgb" style="font-size:11px;color:var(--sub);line-height:1.7">💡 리셋 비용은 '+(r.usedToday>0?'오늘 '+r.usedToday+'번 써서 올라간 상태예요. ':'')+'새벽 6시에 초기화돼요 (낚싯대 코인배수 비례).</div></div>';
    p.innerHTML = h;
    var btn=$("rsBtn"); if(btn) btn.onclick=function(){ resetCooldown(btn); };
    if (r.onCooldown){
      var left=r.remainMs;
      resetTimer=setInterval(function(){
        left-=1000; var el=$("rsRemain");
        if(!el){ clearInterval(resetTimer); resetTimer=null; return; }
        if(left<=0){ clearInterval(resetTimer); resetTimer=null; if(tab==="reset"){ st.reset.onCooldown=false; st.reset.remainMs=0; render(); } return; }
        el.textContent=fmtDur(left);
      },1000);
    }
  }
  function resetCooldown(btn){
    if (busy) return; busy=true; btn.disabled=true; btn.textContent="리셋 중…";
    fetch(FN+"/fishRoomReset",{ method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:token, pass:pass}) })
      .then(function(r){ return r.json(); })
      .then(function(d){ busy=false;
        if (d && d.ok){ st=d.state; toast(d.msg||"⏱ 리셋 완료"); render(); }
        else { toast("⚠️ "+((d&&d.error)||"실패")); render(); }
      })
      .catch(function(){ busy=false; toast("⚠️ 네트워크 오류"); render(); });
  }
  function rarKo(r){ return r==="legend"?"전설":r==="rare"?"희귀":"일반"; }
  function rarColor(r){ return r==="legend"?"var(--gold)":r==="rare"?"var(--accent)":"var(--sub)"; }
  function renderGacha(p){
    var price = st.gachaPrice||10000;
    var can1 = st.coins>=price, can10 = st.coins>=price*10;
    var h = '<div class="soon" style="padding:6px 10px 10px;font-size:12px;line-height:1.7">🎰 뽑기로 코인·미끼·<b style="color:var(--gold)">칭호</b> 획득! 칭호는 랭킹·낚시정보에 표시되는 수집 플렉스예요.</div>';
    h += '<div style="display:flex;gap:8px;margin-bottom:12px">';
    h += '<button class="btn" id="gc1" style="flex:1;margin-top:0;line-height:1.3'+(can1?'':';opacity:.45')+'"'+(can1?'':' disabled')+'>1회<br><span style="font-size:12px">🪙'+won(price)+'</span></button>';
    h += '<button class="btn" id="gc10" style="flex:1;margin-top:0;line-height:1.3;color:#5a3d00;background:linear-gradient(180deg,#ffe07a,#e0a800)'+(can10?'':';opacity:.45')+'"'+(can10?'':' disabled')+'>10연<br><span style="font-size:12px">🪙'+won(price*10)+'</span></button>';
    h += '</div>';
    if (lastGacha && lastGacha.length){
      h += '<div class="dexg"><div class="dgh">🎁 뽑기 결과</div>';
      lastGacha.forEach(function(r){
        var c = (r.type==="jackpot")?"var(--gold)":(r.type==="title")?"var(--accent)":"var(--txt)";
        h += '<div style="padding:5px 2px;font-size:14px;color:'+c+'">'+r.label+'</div>';
      });
      h += '</div>';
    }
    h += '<div style="font-family:var(--disp);font-size:15px;margin:14px 0 8px">🏷 내 칭호 <span style="color:var(--sub);font-size:12px">('+(st.titles?st.titles.length:0)+'/'+(st.titleCatalog?st.titleCatalog.length:0)+')</span></div>';
    (st.titleCatalog||[]).forEach(function(tc){
      var color = rarColor(tc.rarity);
      h += '<div class="item" style="padding:9px 12px'+(tc.cur?';border-color:var(--good)':'')+'">';
      h += '<div class="mid"><div class="nm" style="font-size:15px;color:'+(tc.owned?color:'var(--sub)')+'">'+tc.emoji+' '+tc.name+' <span style="font-size:11px;color:'+color+'">'+rarKo(tc.rarity)+'</span></div></div>';
      if (tc.cur) h += '<button class="buy cur" disabled>✅ 장착중</button>';
      else if (tc.owned) h += '<button class="buy" data-tt="'+encodeURIComponent(tc.name)+'">장착</button>';
      else h += '<span class="pr" style="color:var(--sub)">🔒 미보유</span>';
      h += '</div>';
    });
    if (st.title) h += '<div style="text-align:center;margin-top:8px"><button class="buy" data-tt="" style="padding:6px 14px;font-size:12px;background:#1a2c42;color:var(--sub)">칭호 해제</button></div>';
    p.innerHTML = h;
    var b1=$("gc1"); if(b1) b1.onclick=function(){ gachaPull(1,b1); };
    var b10=$("gc10"); if(b10) b10.onclick=function(){ gachaPull(10,b10); };
    Array.prototype.forEach.call(p.querySelectorAll("[data-tt]"), function(b){
      b.onclick=function(){ equipTitle(decodeURIComponent(b.getAttribute("data-tt")), b); };
    });
  }
  function gachaPull(count, btn){
    if (busy) return; busy=true; btn.disabled=true; btn.innerHTML="뽑는 중…";
    fetch(FN+"/fishRoomGacha",{ method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:token, action:"pull", count:count, pass:pass}) })
      .then(function(r){ return r.json(); })
      .then(function(d){ busy=false;
        if (d && d.ok){ st=d.state; lastGacha=d.results||[];
          var tt=lastGacha.filter(function(x){return x.type==="title"||(x.type==="jackpot"&&x.name);});
          toast(tt.length?("🏷 칭호 획득! "+tt.map(function(x){return x.name;}).join(", ")):"🎁 뽑기 완료");
          render();
        } else { toast("⚠️ "+((d&&d.error)||"실패")); render(); }
      })
      .catch(function(){ busy=false; toast("⚠️ 네트워크 오류"); render(); });
  }
  function equipTitle(name, btn){
    if (busy) return; busy=true; btn.disabled=true;
    fetch(FN+"/fishRoomGacha",{ method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:token, action:"equipTitle", name:name, pass:pass}) })
      .then(function(r){ return r.json(); })
      .then(function(d){ busy=false;
        if (d && d.ok){ st=d.state; toast(d.msg||"🏷 완료"); render(); }
        else { toast("⚠️ "+((d&&d.error)||"실패")); render(); }
      })
      .catch(function(){ busy=false; toast("⚠️ 네트워크 오류"); render(); });
  }
  function renderEnhance(p){
    var h = '<div class="soon" style="padding:6px 10px 12px;font-size:12px;line-height:1.7">⚒ <b style="color:var(--txt)">착용 중인</b> 장비를 강화해요. 레벨이 높을수록 <b style="color:var(--txt)">성공률 급락</b>, <b style="color:var(--bad)">실패 시 코인만 소모</b>(레벨 유지). 강화는 아이템별로 저장돼요.</div>';
    var cats = [["rod","🎣 낚싯대"],["line","🧵 낚싯줄"],["float","🎣 찌"]];
    cats.forEach(function(c){
      var e = (st.enh||{})[c[0]]; if(!e) return;
      var maxed = e.maxed;
      h += '<div class="item" style="flex-wrap:wrap'+(maxed?';border-color:var(--gold)':'')+'">';
      h += '<div class="mid" style="flex:1 1 60%"><div class="nm">'+c[1].split(" ")[0]+' '+e.name+
           ' <span style="color:var(--gold);font-size:14px">'+(e.level>0?"+"+e.level:"+0")+'</span></div>'+
           '<div class="st">'+e.stat+'</div></div>';
      if (maxed){
        h += '<div class="pr" style="flex:0 0 auto;color:var(--gold)">최대 ✨</div>';
      } else {
        var can = st.coins >= e.nextCost;
        h += '<div class="pr" style="flex:0 0 auto;text-align:right">→ +'+(e.level+1)+'<br><span style="font-size:11px;color:var(--sub)">성공 '+e.nextRate+'%</span></div>';
        h += '<div style="flex:1 1 100%;display:flex;gap:8px;align-items:center;margin-top:8px">';
        h += '<div style="flex:1;font-size:12px;color:var(--gold)">🪙 '+won(e.nextCost)+'</div>';
        h += '<button class="buy" style="flex:0 0 auto'+(can?'':';opacity:.45')+'" '+(can?('data-enh="'+c[0]+'"'):'disabled')+'>강화</button>';
        h += '</div>';
      }
      h += '</div>';
    });
    // 강화 성공률 표
    h += '<div class="dexg" style="margin-top:10px"><div class="dgh">📈 성공률</div><div class="dgb" style="font-size:11px;color:var(--sub);line-height:1.8">'+
         '+1 95% · +2 90% · +3 85% · +4 78% · +5 70% · +6 60% · +7 50% · +8 40% · +9 30% · +10 22%</div></div>';
    p.innerHTML = h;
    Array.prototype.forEach.call(p.querySelectorAll("[data-enh]"), function(b){
      b.onclick=function(){ enhance(b.getAttribute("data-enh"), b); };
    });
  }
  function enhance(cat, btn){
    if (busy) return; busy=true; btn.disabled=true; btn.textContent="강화 중…";
    fetch(FN+"/fishRoomEnhance",{ method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:token, cat:cat, pass:pass}) })
      .then(function(r){ return r.json(); })
      .then(function(d){ busy=false;
        if (d && d.ok){ st=d.state; toast(d.msg||(d.success?"✨ 성공":"💥 실패")); render(); }
        else { toast("⚠️ "+((d&&d.error)||"실패")); render(); }
      })
      .catch(function(){ busy=false; toast("⚠️ 네트워크 오류"); render(); });
  }
  function baitAction(action, name, qty, btn){
    if (busy) return; busy=true; btn.disabled=true; var old=btn.innerHTML; btn.innerHTML="처리 중…";
    fetch(FN+"/fishRoomBait",{ method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:token, action:action, name:name, qty:qty, pass:pass}) })
      .then(function(r){ return r.json(); })
      .then(function(d){ busy=false;
        if (d && d.ok){ st=d.state; toast(d.msg||"✅ 완료"); render(); }
        else { toast("⚠️ "+((d&&d.error)||"실패")); render(); }
      })
      .catch(function(){ busy=false; toast("⚠️ 네트워크 오류"); render(); });
  }

  var dexBook = 1;
  function renderDex(p){
    var h = '<div class="tabs" style="margin-bottom:10px">';
    var bk=["📖 1","📗 2","📘 3","📙 4"];
    for (var i=1;i<=4;i++){ h += '<div class="tab'+(i===dexBook?" on":"")+'" data-bk="'+i+'">'+bk[i-1]+'</div>'; }
    h += '</div><div id="dexList" class="soon">불러오는 중…</div>';
    p.innerHTML = h;
    Array.prototype.forEach.call(p.querySelectorAll(".tab[data-bk]"), function(b){
      b.onclick=function(){ dexBook=+b.getAttribute("data-bk"); render(); };
    });
    loadDex();
  }
  function loadDex(){
    fetch(FN+"/fishRoomDex?t="+encodeURIComponent(token)+"&book="+dexBook+(pass?("&pass="+encodeURIComponent(pass)):""))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var el=$("dexList"); if(!el) return;
        if (!d || !d.ok){ el.textContent="불러오기 실패"; return; }
        var h='<div style="text-align:center;font-family:var(--disp);font-size:16px;margin:2px 0 12px">'+d.label+' · <span style="color:var(--good)">'+d.caught+'</span>/'+d.total+'</div>';
        d.groups.forEach(function(g){
          h+='<div class="dexg"><div class="dgh">'+g.emoji+' '+g.tier+' <span>('+g.caught.length+'/'+g.total+')</span></div><div class="dgb">';
          g.caught.forEach(function(it){ h+='<span class="fc">'+it.name+' ×'+it.n+'</span>'; });
          if (g.missing>0) h+='<span class="fc miss">❔ '+g.missing+'종 미발견</span>';
          h+='</div></div>';
        });
        el.className=""; el.innerHTML=h;
      })
      .catch(function(){ var el=$("dexList"); if(el) el.textContent="네트워크 오류"; });
  }

  function rodStat(it){ return "희귀↑ ×"+it.luck+"  ·  코인 ×"+it.mult; }
  function lineStat(it){ return "손맛 장력 "+Math.round((1-it.resist)*100)+"%↓"; }
  function floatStat(it){ return "찌맛 입질창 +"+Math.round((it.win-1)*100)+"%  ·  패널티 "+Math.round((1-it.calm)*100)+"%↓"; }

  function renderShop(p, items, kind, statFn){
    items.forEach(function(it){
      var row=document.createElement("div");
      row.className="item"+(it.cur?" cur":"");
      var data='data-kind="'+kind+'" data-name="'+encodeURIComponent(it.name)+'"';
      var btn, pr;
      if (it.cur){ btn='<button class="buy cur" disabled>✅ 사용중</button>'; pr="보유"; }
      else if (it.owned){ btn='<button class="buy" '+data+'>장착</button>'; pr="보유"; }
      else if (st.coins < it.price){ btn='<button class="buy" disabled>코인 부족</button>'; pr="🪙 "+won(it.price); }
      else { btn='<button class="buy" '+data+'>구매·장착</button>'; pr="🪙 "+won(it.price); }
      row.innerHTML =
        '<div class="mid"><div class="nm">'+it.name+'</div><div class="st">'+statFn(it)+'</div></div>'+
        '<div class="pr">'+(it.price===0?"기본":pr)+'</div>'+btn;
      p.appendChild(row);
    });
    // 구매 버튼 바인딩
    Array.prototype.forEach.call(p.querySelectorAll(".buy:not([disabled])"), function(b){
      b.onclick=function(){ buy(b.getAttribute("data-kind"), decodeURIComponent(b.getAttribute("data-name")), b); };
    });
  }

  function buy(kind, name, btn){
    if (busy) return; busy=true; btn.textContent="구매 중…"; btn.disabled=true;
    fetch(FN+"/fishRoomBuy",{ method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:token, kind:kind, name:name, pass:pass}) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        busy=false;
        if (d && d.ok){ st=d.state; toast(d.msg||"✅ 완료"); render(); }
        else { toast("⚠️ "+((d&&d.error)||"실패")); render(); }
      })
      .catch(function(){ busy=false; toast("⚠️ 네트워크 오류"); render(); });
  }
})();
</script>
</body>
</html>
