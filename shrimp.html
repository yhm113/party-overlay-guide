<title>새우잡기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root{
    --bg:#0b2231; --panel:#123246; --line:#2b5570; --txt:#eaf4fb; --sub:#a8c4d6;
    --accent:#4fc3f7; --gold:#ffcf3f; --good:#45d17a; --bad:#ff6b6b;
    --disp:"Jua","Malgun Gothic",sans-serif; --body:-apple-system,"Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--body);overflow:hidden}
  #wrap{width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #game{display:flex;flex-direction:row;width:100%}
  /* 왼쪽 랭킹 패널 */
  #leftrank{width:clamp(52px,13vw,86px);flex:none;height:100%;background:var(--panel);border-right:1px solid var(--line);padding:6px 4px;overflow-y:auto}
  .lrtitle{font-family:var(--disp);font-size:13px;text-align:center;color:var(--gold);margin-bottom:6px}
  .lrrow{font-size:11px;color:var(--sub);padding:3px 1px;border-bottom:1px solid rgba(255,255,255,.05);line-height:1.35}
  .lrrow .n{color:var(--txt);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrrow .k{color:var(--good)}
  /* 게임 스테이지 */
  #stage{position:relative;flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;background:#0b2231;overflow:hidden}
  #cv{display:block;touch-action:none}
  #hud{position:absolute;top:8px;left:8px;display:flex;gap:8px;pointer-events:none;font-variant-numeric:tabular-nums;z-index:2}
  .pill{background:rgba(8,24,36,.72);border:1px solid var(--line);border-radius:12px;padding:6px 11px;font-size:15px;font-family:var(--disp)}
  .pill b{color:var(--accent)} .pill.kg b{color:var(--good)}
  #timebar{position:absolute;top:8px;right:8px;left:8px;top:42px;height:6px;background:rgba(8,24,36,.6);border-radius:6px;overflow:hidden;z-index:2}
  #timefill{height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--gold) 60%,var(--bad))}
  /* 오른쪽 세로 패널 */
  #side{width:clamp(56px,14vw,86px);flex:none;height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:6px}
  #sideCoin{font-family:var(--disp);font-size:14px;text-align:center;color:var(--gold);background:#0e2636;border:1px solid var(--line);border-radius:10px;padding:7px 2px;margin-bottom:6px}
  #sideCoin small{display:block;font-size:10px;color:var(--sub);font-family:var(--body)}
  #upg{flex:1;display:flex;flex-direction:column;gap:5px;overflow-y:auto}
  .u{background:#0e2636;border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;cursor:pointer;transition:.1s}
  .u:active{transform:scale(.95)}
  .u.max{opacity:.5}
  .u .ic{font-size:18px} .u .lv{font-size:11px;color:var(--sub)} .u .cost{font-size:11px;color:var(--gold)}
  .u.no{border-color:#4a2626}.u.no .cost{color:var(--bad)}
  /* 오버레이 */
  .ov{position:absolute;inset:0;background:rgba(6,18,28,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;z-index:5;overflow-y:auto}
  .ov h1{font-family:var(--disp);font-weight:400;font-size:28px;margin:0 0 6px}
  .ov p{color:var(--sub);font-size:13px;line-height:1.7;margin:3px 0}
  .btn{font-family:var(--disp);font-size:20px;border:none;border-radius:16px;padding:15px 38px;margin-top:14px;cursor:pointer;background:linear-gradient(180deg,#7dd6ff,var(--accent));color:#06263a;box-shadow:0 6px 0 #1d7fb0}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1d7fb0}
  .big{font-size:48px;margin:2px}
  .rankrow{display:flex;justify-content:space-between;width:100%;max-width:320px;font-size:14px;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
  .rankrow b{color:var(--gold)}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:18px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
  .hint{color:var(--sub);font-size:12px;margin-top:8px;line-height:1.6}
</style>

<div id="wrap"><div id="game">
  <div id="leftrank">
    <div class="lrtitle">🏆 랭킹</div>
    <div id="lrlist"></div>
  </div>
  <div id="stage">
    <canvas id="cv" width="960" height="600"></canvas>
    <div id="hud">
      <div class="pill">⏱ <b id="tTxt">60</b></div>
      <div class="pill kg">⚖️ <b id="kgTxt">0.00</b>kg</div>
    </div>
    <div id="timebar"><div id="timefill"></div></div>

    <div id="loading" class="ov"><div class="spin"></div><p>새우들 불러오는 중…</p></div>
    <div id="errbox" class="ov hidden"><div class="big">🦐</div><h1 id="errTitle">입장 불가</h1><p id="errMsg"></p></div>
    <div id="intro" class="ov hidden">
      <div class="big">🦐</div><h1>새우잡기!</h1>
      <p id="introSub"></p>
      <p class="hint"><b style="color:var(--txt)">탭·드래그</b>로 새우를 잡으세요 (뜰채는 손가락 <b style="color:var(--txt)">위쪽</b>에 떠서 새우 안 가림)<br>클수록 HP↑ · 이벤트코인으로 <b style="color:var(--gold)">뜰채 강화</b>(오른쪽)<br>🌟황금새우는 대박! · 🔍탐지 올리면 큰 새우 잘 나옴<br>📱 <b style="color:var(--txt)">가로로 돌리면</b> 화면 꽉 참</p>
      <button class="btn" id="startBtn">시작하기</button>
    </div>
    <div id="result" class="ov hidden">
      <div class="big" id="resEmoji">🦐</div><h1 id="resTitle">끝!</h1>
      <p id="resDesc"></p>
      <div id="rankList" style="width:100%;max-width:320px;margin-top:8px"></div>
      <p class="hint" id="resHint"></p>
    </div>
  </div>

  <div id="side">
    <div id="sideCoin">🪙<b id="coinTxt">0</b><small>이벤트코인</small></div>
    <div id="upg"></div>
  </div>
</div></div>

<script>
(function(){
"use strict";
var FN="https://asia-northeast3-partyoverlay-786d6.cloudfunctions.net";
var $=function(id){return document.getElementById(id);};
function qs(k){var m=location.search.match(new RegExp("[?&]"+k+"=([^&]+)"));return m?decodeURIComponent(m[1]):"";}
var token=qs("t");

var TYPES=[
  {id:"jeot", name:"젓새우",  scale:0.40, kg:[0.01,0.03], hp:[1,2],  coin:1,  spawn:45, spd:[30,55]},
  {id:"daeha",name:"대하",    scale:0.60, kg:[0.05,0.12], hp:[2,4],  coin:3,  spawn:30, spd:[45,75]},
  {id:"bori", name:"보리새우",scale:0.78, kg:[0.2,0.5],   hp:[6,10], coin:10, spawn:15, spd:[60,95]},
  {id:"dak",  name:"닭새우",  scale:0.92, kg:[0.8,1.8],   hp:[20,30],coin:40, spawn:8,  spd:[85,135]},
  {id:"gold", name:"황금새우",scale:0.75, kg:[0.3,0.7],   hp:[10,14],coin:100,spawn:2,  spd:[105,155]}
];
var SPRITE_G=0.46;
var UPG_DEF=[
  {k:"atk",  ic:"⚔️", cost:function(lv){return 20*(lv+1);}},
  {k:"delay",ic:"⚡", cost:function(lv){return 30*(lv+1);}},
  {k:"crit", ic:"💥", cost:function(lv){return 40*(lv+1);}},
  {k:"acc",  ic:"🎯", cost:function(lv){return 25*(lv+1);}},
  {k:"time", ic:"⏱", cost:function(lv){return 35*(lv+1);}},
  {k:"detect",ic:"🔍",cost:function(lv){return 30*(lv+1);}}
];
function dmgOf(u){return 1+u.atk;}
function cooldownOf(u){return 0.4-u.delay*0.03;}
function critOf(u){return u.crit*0.03;}
function accOf(u){return 0.5+u.acc*0.05;}
function timeOf(u){return 60+u.time*6;}

var IMG={}, NEED=["bg","jeot","daeha","bori","dak","gold","net","splash","star"];
function loadImg(n){return new Promise(function(res){var im=new Image();im.onload=function(){res(im);};im.onerror=function(){res(null);};im.src="img/shrimp/"+n+".png";});}

var cv=$("cv"), ctx=cv.getContext("2d"), W=960, H=600;
var upg={atk:0,delay:0,crit:0,acc:0,time:0,detect:0}, eventCoins=0, totalKg=0, playsLeft=0;
var sessKg=0, sessCoin=0;
var shrimps=[], fx=[], gt=0, timeLeft=60, running=false, over=false, resolved=false;
var lastTap=-1, netX=W/2, netY=H/2, netSwing=0, spawnTimer=0, catchBanner=null, floaters=[];
function addFloater(text,x,y,color){ floaters.push({text:text,x:x,y:y,t:0,color:color||"#ff6b6b"}); }
var NET_R=70;

function fail(t,m){ ["loading","intro"].forEach(function(i){$(i).classList.add("hidden");}); var e=$("errbox"); e.classList.remove("hidden"); $("errTitle").textContent=t; $("errMsg").textContent=m; }

// 캔버스 크기(8:5 유지) — 뷰포트에서 패널 폭 뺀 공간에 맞추고 #game 높이=캔버스 높이(패널도 그 높이, 중앙정렬)
function resizeCanvas(){
  var vw=document.documentElement.clientWidth||window.innerWidth;
  var vh=window.innerHeight, ar=W/H;
  var pw=$("leftrank").offsetWidth+$("side").offsetWidth;
  var availW=Math.max(140,vw-pw);
  var cw=availW, ch=cw/ar; if(ch>vh){ ch=vh; cw=ch*ar; }
  cv.style.width=Math.floor(cw)+"px"; cv.style.height=Math.floor(ch)+"px";
  $("game").style.height=Math.floor(ch)+"px";
}
window.addEventListener("resize",function(){resizeCanvas();render();});
window.addEventListener("orientationchange",function(){setTimeout(function(){resizeCanvas();render();},200);});

Promise.all(NEED.map(loadImg)).then(function(arr){
  NEED.forEach(function(n,i){IMG[n]=arr[i];});
  if(!token){ fail("잘못된 접속","카톡의 /새우 링크로 다시 들어와 주세요."); return; }
  $("loading").classList.add("hidden");
  $("intro").classList.remove("hidden");
  $("introSub").textContent="60초 안에 최대한 잡아보자!";
  buildUpgBar(); resizeCanvas(); render(); loadLeftRank();
});
function loadLeftRank(){
  fetch(FN+"/shrimpRank").then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok)return; var rk=d.rank||[], h=$("lrlist"); h.innerHTML="";
    if(!rk.length){ h.innerHTML="<div class='lrrow'>아직<br>없음</div>"; return; }
    for(var i=0;i<Math.min(12,rk.length);i++){ var row=document.createElement("div"); row.className="lrrow"; row.innerHTML=(i+1)+". <span class='n'>"+rk[i].nick+"</span><span class='k'>"+rk[i].kg+"kg</span>"; h.appendChild(row); }
  }).catch(function(){});
}

$("startBtn").onclick=function(){
  var b=$("startBtn"); b.disabled=true; b.textContent="시작 중...";
  fetch(FN+"/shrimpBegin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:token})})
    .then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok){ fail("시작 불가", (d&&d.error)||"이미 시작됐거나 만료된 판이에요."); return; }
      upg=Object.assign({atk:0,delay:0,crit:0,acc:0,time:0,detect:0}, d.upgrades||{});
      eventCoins=d.eventCoins||0; totalKg=d.totalKg||0; playsLeft=d.playsLeft||0;
      $("intro").classList.add("hidden"); startGame();
    }).catch(function(){ b.disabled=false; b.textContent="시작하기"; fail("연결 실패","네트워크 확인 후 다시."); });
};

function startGame(){
  timeLeft=timeOf(upg); sessKg=0; sessCoin=0; shrimps=[]; fx=[]; gt=0; over=false; resolved=false; running=true; catchBanner=null;
  resizeCanvas(); refreshUpgBar(); render(); loadLeftRank();
  last=performance.now(); requestAnimationFrame(loop);
}

function buildUpgBar(){
  var host=$("upg"); host.innerHTML="";
  UPG_DEF.forEach(function(d){
    var el=document.createElement("div"); el.className="u"; el.id="u_"+d.k;
    el.innerHTML='<div class="ic">'+d.ic+'</div><div class="lv" id="ulv_'+d.k+'">Lv0</div><div class="cost" id="uc_'+d.k+'">'+d.cost(0)+'</div>';
    el.onclick=function(){ buyUpg(d); };
    host.appendChild(el);
  });
}
function refreshUpgBar(){
  UPG_DEF.forEach(function(d){
    var lv=upg[d.k]||0, el=$("u_"+d.k); if(!el)return;
    $("ulv_"+d.k).textContent="Lv"+lv;
    var maxed=lv>=10;
    $("uc_"+d.k).textContent=maxed?"MAX":d.cost(lv);
    el.className="u"+(maxed?" max":((sessCoin+eventCoins)<d.cost(lv)?" no":""));
  });
  $("coinTxt").textContent=(eventCoins+sessCoin);
}
function buyUpg(d){
  var lv=upg[d.k]||0; if(lv>=10) return;
  var cost=d.cost(lv), pool=sessCoin+eventCoins; if(pool<cost) return;
  if(sessCoin>=cost){ sessCoin-=cost; } else { var rem=cost-sessCoin; sessCoin=0; eventCoins-=rem; }
  upg[d.k]=lv+1;
  if(d.k==="time"&&running){ timeLeft+=6; }
  refreshUpgBar();
}

// 스폰 (탐지=고급 확률↑)
function pickType(){
  var boost=1+(upg.detect||0)*0.15, w=[], tot=0, i;
  for(i=0;i<TYPES.length;i++){ var ww=(TYPES[i].id==="jeot"||TYPES[i].id==="daeha")?TYPES[i].spawn:TYPES[i].spawn*boost; w.push(ww); tot+=ww; }
  var r=Math.random()*tot;
  for(i=0;i<TYPES.length;i++){ r-=w[i]; if(r<=0)return TYPES[i]; }
  return TYPES[0];
}
function maxOn(){ return 9+Math.round((upg.detect||0)*0.8); }
function spawn(){
  var t=pickType(), sv=0.85+Math.random()*0.30, f=(sv-0.85)/0.30;
  var kg=t.kg[0]+(t.kg[1]-t.kg[0])*f;
  var hp=Math.max(1,Math.round(t.hp[0]+(t.hp[1]-t.hp[0])*f));
  var size=512*t.scale*SPRITE_G*sv, dir=Math.random()<0.5?1:-1, y=150+Math.random()*(H-230);
  shrimps.push({t:t,x:dir>0?-size:W+size,y:y,y0:y,dir:dir,vx:dir*(t.spd[0]+Math.random()*(t.spd[1]-t.spd[0])),bob:Math.random()*6.28,size:size,kg:kg,hp:hp,maxhp:hp,flash:0});
}

function tapAt(px,py){
  if(over||!running) return;
  if(gt-lastTap<cooldownOf(upg)) return;
  lastTap=gt; netX=px; netY=py; netSwing=0.14; addFx("splash",px,py);
  var best=null,bd=1e9;
  for(var i=0;i<shrimps.length;i++){ var s=shrimps[i]; var d=Math.hypot(s.x-px,s.y-py); if(d<NET_R+s.size*0.28&&d<bd){bd=d;best=s;} }
  if(!best) return;
  if(Math.random()>accOf(upg)){ addFloater("MISS", netX, netY-30, "#ff6b6b"); return; }
  var dmg=dmgOf(upg); var isCrit=Math.random()<critOf(upg); if(isCrit)dmg*=2;
  best.hp-=dmg; best.flash=0.15;
  if(isCrit) addFloater("CRIT!", netX, netY-30, "#ffcf3f");
  if(best.hp<=0){
    sessKg+=best.kg; sessCoin+=best.t.coin; best.dead=true;
    addFx("star",best.x,best.y);
    catchBanner={id:best.t.id,kg:best.kg,t:0};
    refreshUpgBar();
  }
}
function evtXY(e){ var r=cv.getBoundingClientRect(); var cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left, cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top; return [cx*(W/r.width), cy*(H/r.height)]; }
// 📱 손가락 가림 방지: 터치는 실제 지점보다 위쪽에서 잡히게(뜰채가 손가락 위에 뜸)
function toff(){ return 70*(W/(cv.clientWidth||W)); }
cv.addEventListener("touchstart",function(e){e.preventDefault();var p=evtXY(e);tapAt(p[0],p[1]-toff());},{passive:false});
cv.addEventListener("touchmove",function(e){e.preventDefault();var p=evtXY(e);tapAt(p[0],p[1]-toff());},{passive:false}); // 드래그로 훑어잡기
cv.addEventListener("mousedown",function(e){var p=evtXY(e);tapAt(p[0],p[1]);});
cv.addEventListener("mousemove",function(e){if(running&&!over){var p=evtXY(e);netX=p[0];netY=p[1];}});

function addFx(type,x,y){ fx.push({type:type,x:x,y:y,t:0}); }

var last=0;
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now; gt+=dt;
  if(!over){
    timeLeft-=dt;
    spawnTimer-=dt;
    if(spawnTimer<=0&&shrimps.length<maxOn()){ spawn(); spawnTimer=(0.35+Math.random()*0.5)*(1-(upg.detect||0)*0.05); }
    for(var i=shrimps.length-1;i>=0;i--){ var s=shrimps[i]; s.x+=s.vx*dt; s.bob+=dt*3; s.y=s.y0+Math.sin(s.bob)*7; if(s.flash>0)s.flash-=dt; if(s.dead||s.x<-s.size-20||s.x>W+s.size+20)shrimps.splice(i,1); }
    if(netSwing>0)netSwing-=dt;
    if(timeLeft<=0){ timeLeft=0; over=true; finish(); }
  }
  for(var j=fx.length-1;j>=0;j--){ fx[j].t+=dt; if(fx[j].t>0.3)fx.splice(j,1); }
  for(var k=floaters.length-1;k>=0;k--){ floaters[k].t+=dt; if(floaters[k].t>0.8)floaters.splice(k,1); }
  if(catchBanner){ catchBanner.t+=dt; if(catchBanner.t>1.4)catchBanner=null; }
  render();
  if(!resolved) requestAnimationFrame(loop);
}

function drawSheet(img,frame,x,y,size,flip,alpha){
  if(!img)return;
  ctx.save(); ctx.globalAlpha=alpha==null?1:alpha; ctx.translate(x,y); if(flip)ctx.scale(-1,1);
  ctx.drawImage(img,frame*512,0,512,512,-size/2,-size/2,size,size); ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);
  if(IMG.bg)ctx.drawImage(IMG.bg,0,0,W,H); else{ctx.fillStyle="#12405a";ctx.fillRect(0,0,W,H);}
  var frame=(Math.floor(gt/0.3)%2), i;
  // 새우
  for(i=0;i<shrimps.length;i++){
    var s=shrimps[i], img=IMG[s.t.id], flip=s.dir>0;
    if(s.t.id==="gold"){ ctx.save(); ctx.shadowColor="rgba(255,207,63,.8)"; ctx.shadowBlur=18; drawSheet(img,frame,s.x,s.y,s.size,flip); ctx.restore(); }
    else drawSheet(img,frame,s.x,s.y,s.size,flip);
    if(s.flash>0){ ctx.save(); ctx.globalCompositeOperation="lighter"; drawSheet(img,frame,s.x,s.y,s.size,flip,s.flash*3); ctx.restore(); }
    if(s.maxhp>3&&s.hp<s.maxhp){ var bw=s.size*0.45; ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(s.x-bw/2,s.y-s.size*0.34,bw,5); ctx.fillStyle="#45d17a"; ctx.fillRect(s.x-bw/2,s.y-s.size*0.34,bw*(s.hp/s.maxhp),5); }
  }
  // 뜰채(커서) — 이펙트보다 먼저(뒤에)
  if(running&&!over){ var nf=netSwing>0?1:0; drawSheet(IMG.net,nf,netX+13,netY+13,75,false); }
  // 이펙트 — 뜰채 앞(위)
  for(var j=0;j<fx.length;j++){ var f=fx[j], fr=f.t<0.15?0:1, im=(f.type==="splash"?IMG.splash:IMG.star), sz=(f.type==="star"?156:117); drawSheet(im,fr,f.x,f.y,sz,false,1-f.t*2.2); }
  // 플로팅 텍스트(MISS/CRIT) — 위로 떠오르며 사라짐
  for(var k=0;k<floaters.length;k++){ var fl=floaters[k], fa=1-fl.t/0.8; ctx.save(); ctx.globalAlpha=Math.max(0,fa);
    ctx.font="bold 34px Jua, sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.lineWidth=6; ctx.strokeStyle="rgba(0,0,0,.55)"; ctx.fillStyle=fl.color;
    var fy=fl.y-fl.t*70; ctx.strokeText(fl.text,fl.x,fy); ctx.fillText(fl.text,fl.x,fy); ctx.restore(); }
  // 잡은 새우 상단중앙 표기
  if(catchBanner){ var a=catchBanner.t<1?1:(1.4-catchBanner.t)/0.4; ctx.save(); ctx.globalAlpha=Math.max(0,a);
    drawSheet(IMG[catchBanner.id],frame,W/2-46,70,78,true);
    ctx.font="30px Jua, sans-serif"; ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.lineWidth=5; ctx.strokeStyle="rgba(0,0,0,.6)"; ctx.fillStyle="#ffcf3f";
    var txt="+"+catchBanner.kg.toFixed(2)+"kg"; ctx.strokeText(txt,W/2,70); ctx.fillText(txt,W/2,70); ctx.restore();
  }
  $("tTxt").textContent=Math.ceil(timeLeft);
  $("kgTxt").textContent=(totalKg+sessKg).toFixed(2);
  $("timefill").style.width=(timeLeft/timeOf(upg)*100)+"%";
}

function finish(){
  running=false;
  fetch(FN+"/shrimpResolve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:token,upgrades:upg,eventCoins:(eventCoins+sessCoin),kgGained:sessKg})})
    .then(function(r){return r.json();}).then(function(d){ resolved=true; showResult(d); })
    .catch(function(){ resolved=true; showResult(null); });
}
function showResult(d){
  $("result").classList.remove("hidden");
  $("resEmoji").textContent=sessKg>=1?"🦞":"🦐";
  $("resTitle").textContent="이번 판 "+sessKg.toFixed(2)+"kg!";
  $("resDesc").innerHTML="🪙 이벤트코인 +"+sessCoin+" · 남은 판 "+playsLeft+"/5<br>누적 "+((d&&d.totalKg!=null)?d.totalKg:(totalKg+sessKg).toFixed(2))+"kg";
  $("resHint").textContent=(d&&d.ok)?"✅ 저장 완료! 카톡 /새우 랭킹 확인":"⚠️ 저장 실패(네트워크)";
  loadRank(); loadLeftRank();
}
function loadRank(){
  fetch(FN+"/shrimpRank").then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok)return; var rk=d.rank||[], h=$("rankList"); h.innerHTML="<div class='rankrow'><b>🏆 kg 랭킹</b><span></span></div>";
    for(var i=0;i<Math.min(8,rk.length);i++){ var row=document.createElement("div"); row.className="rankrow"; row.innerHTML="<span>"+(i+1)+". "+rk[i].nick+"</span><b>"+rk[i].kg+"kg</b>"; h.appendChild(row); }
  }).catch(function(){});
}
})();
</script>
